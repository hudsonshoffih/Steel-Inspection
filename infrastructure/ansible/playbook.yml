---
# Prepares a fresh Ubuntu 24.04 server: base tools, swap, Docker and single-node Kubernetes (k3s).
# Safe to run again: every task checks before it changes anything.
- name: Configure the steel inspection server
  hosts: steel
  become: true

  vars:
    swap_file: /swapfile
    swap_size_mb: 2048

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, git, unzip, htop]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create a swap file (extra safety for the PyTorch container on a 4 GB machine)
      ansible.builtin.command:
        cmd: "fallocate -l {{ swap_size_mb }}M {{ swap_file }}"
        creates: "{{ swap_file }}"
      register: swap_created

    - name: Restrict swap file permissions
      ansible.builtin.file:
        path: "{{ swap_file }}"
        mode: "0600"

    - name: Format swap file
      ansible.builtin.command: "mkswap {{ swap_file }}"
      when: swap_created.changed

    - name: Enable swap now
      ansible.builtin.command: "swapon {{ swap_file }}"
      when: swap_created.changed

    - name: Keep swap enabled after reboot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "{{ swap_file }} none swap sw 0 0"
        regexp: '^{{ swap_file }}\s'
        state: present

    - name: Install Docker and Compose plugin
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2]
        state: present

    - name: Start Docker and enable it at boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Let the ubuntu user run docker without sudo (takes effect on next login)
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Install k3s (lightweight single-node Kubernetes)
      ansible.builtin.shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode 644" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait until the Kubernetes node is Ready
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      register: nodes
      until: "'Ready' in nodes.stdout and 'NotReady' not in nodes.stdout"
      retries: 30
      delay: 10
      changed_when: false

    - name: Show Kubernetes node
      ansible.builtin.debug:
        var: nodes.stdout_lines
