apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: gateway
          image: steel-gateway
          ports:
            - containerPort: 5000
          env:
            - { name: PYTHON_SERVICE_URL, value: "http://ai:8000" }
            - { name: REPORTS_PATH, value: /data/reports }
            - { name: SPAWN_PYTHON, value: "false" }
          volumeMounts:
            - { name: data, mountPath: /data }     # reads crop images saved by the AI service
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /api/gateway/health, port: 5000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/gateway/health, port: 5000 }
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: steel-data }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports:
    - { port: 5000, targetPort: 5000 }
